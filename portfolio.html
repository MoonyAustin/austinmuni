.tablink {

}

.tablink:hover {

}

.tablink.active {
background-color: #EEBC47;
color: white;
}

.container {
  display: flex;

  height:550px;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  text-align: left;
  border-radius: 10px;
  width: 60%;
  justify-content: center;
  margin-left: auto;
  margin-right: auto;
  max-width: 775px;
  padding: 30px;
}

/* Product Images */

/* Blog Articles */

.container img {
  width:100%;
  height: auto;
  margin-bottom: 20px; /* Add space between the images */
  transition: transform 0.5s;
  padding: 20px;
}

.container:hover img{
  transform: translateY(-10px); /* Adjust the value as needed for the desired float effect */
}

.container:hover .overlay{
  background-color: rgba(255, 255, 255, 0.2); /* Semi-transparent black overlay on hover */
}

.overlay{
  position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0); /* Transparent overlay */
            transition: 0.5s;
