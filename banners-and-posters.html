<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet"> <!-- Link to Google Fonts -->
    <style>
      .container {
        color:white;
        background-color: #0D87DE;
        text-align: left;
        padding-top: 100px;
        padding-left: 200px;
        margin: 0 auto;
        height: 300px;
        display: flex;
        flex-direction: column;
      }
      .gallery {
    display: flex;
    justify-content: center; /* Center the gallery horizontally */
    max-width: 800px; /* Set the maximum width of the gallery */
    margin: 0 auto; /* Center the gallery on the page */
}

.thumbnails {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-around;
    margin-top: 30px;
    gap: 20px;
  
}
.thumbnails img {
    width: 45%;
    object-fit: cover; /* Cover the thumbnail with the image, cropping as needed */
    overflow: hidden; /* Hide any content that exceeds the specified dimensions */
    box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.2); /* Add a subtle drop shadow effect */
    transition: transform 0.3s; /* Add a transition for smooth animation */
    border-radius: 10px;
}

.thumbnails img:hover {
    transform: translateY(-5px); /* Apply a translateY transform on hover */
    cursor:pointer
}

.thumbnails img.horizontal-image {
  width: 100%;
}

.modal {
    display: none;
    position: fixed;
    z-index: 1;
    padding-top: 50px;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    overflow: auto;
    background-color: black;
}

.modal-content {
    margin: auto;
    display: block;
    width: 80%;
    max-width: 800px;
}

.close {
    color: white;
    position: absolute;
    top: 10px;
    right: 25px;
    font-size: 35px;
    cursor: pointer;
}

.prev, .next {
    position: absolute;
    top: 50%;
    width: auto;
    padding: 16px;
    margin-top: -50px;
    color: white;
    font-weight: bold;
    font-size: 20px;
    cursor: pointer;
    text-decoration: none;
}

.prev {
    left: 10px;
}

.next {
    right: 10px;
}

    </style>
    <script src="script.js"></script>

</head>
<body>
    <div class="header">
        <a href="index.html" class="logo-link">
            <img src="mj-avatar.JPG" style="border-radius: 50%" alt="Austin Chen Logo">
            <span>AUSTIN CHEN</span>
        </a>
        <nav>
            <a href="index.html">About</a>
            <a href="resume.html">Resumé</a>
            <a href="portfolio.html">Portfolio</a>
            <a href="contact.html">Contact</a>
        </nav>
    </div>

  <div class="portfolio-banner" style="background-color: #2C2456;">
    <div class="breadcrumb">
      <a href="portfolio.html">Portfolio</a> &gt; Banners & Posters
  </div>
    <h1 style="font-size: 40px"">Banners & Posters</h1>
    <p>These are examples of digital posters and banners I created for livestream announcements and workshops, including a long infographic designed for print.</p>
  </div>

  <div class="gallery">
    <div class="thumbnails">
        <img src="poster 1.png" alt="AI Summary" onclick="openModal('ai summary.png')">
        <img src="poster 2.png" alt="AI Note Taker" onclick="openModal('ai note taker.png')">
        <img src="banner.png" class="horizontal-image" alt="AI Powered Search" onclick="openModal('ai powered search.png')">

    </div>

    <div id="myModal" class="modal">
        <span class="close" onclick="closeModal()">&times;</span>
        <img id="fullImg" class="modal-content">
        <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
        <a class="next" onclick="plusSlides(1)">&#10095;</a>
    </div>
</div>

</body>
</html>
